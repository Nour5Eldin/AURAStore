<div class="dt-wrap">
    <table class="dt">
        <thead>
            <tr>
                <th *ngFor="let col of columns" [style.width]="col.width || 'auto'"
                    [class.dt__th--sortable]="col.sortable" (click)="onSort(col)">
                    {{ col.label }}
                    <span *ngIf="col.sortable && sortKey === col.key" class="dt__sort-icon">
                        {{ sortDir === 'asc' ? '↑' : '↓' }}
                    </span>
                </th>
                <!-- Actions slot -->
                <th class="dt__actions-col">Actions</th>
            </tr>
        </thead>

        <tbody>
            <!-- Skeleton -->
            <ng-container *ngIf="loading">
                <tr *ngFor="let i of [1,2,3,4,5]">
                    <td [attr.colspan]="columns.length + 1">
                        <app-skeleton-loader height="40px"></app-skeleton-loader>
                    </td>
                </tr>
            </ng-container>

            <!-- Rows -->
            <tr *ngFor="let row of rows" class="dt__row" (click)="rowClick.emit(row)">
                <td *ngFor="let col of columns">
                    <ng-container *ngIf="getValue(row, col.key) !== undefined; else emptyCell">
                        {{ getValue(row, col.key) }}
                    </ng-container>
                    <ng-template #emptyCell>—</ng-template>
                </td>
                <!-- Actions projection -->
                <td class="dt__actions-cell">
                    <ng-content select="[actions]"></ng-content>
                </td>
            </tr>
        </tbody>
    </table>

    <!-- Empty State -->
    <app-empty-state *ngIf="!loading && rows.length === 0" [icon]="emptyIcon" [title]="emptyMessage">
    </app-empty-state>
</div>
