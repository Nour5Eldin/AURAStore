<div class="forgot-layout">
    <div class="forgot-layout__image"><img src="https://images.unsplash.com/photo-1490578474895-699cd4e2cf59?w=800" alt="Fashion" /></div>
    <div class="forgot-layout__content">
        <a routerLink="/auth/login" class="forgot__back">← Back to Login</a>
        <div class="forgot__header">
            <h1 class="forgot__main-title">Password Recovery</h1>
            <p class="forgot__main-sub">Continue to Auth0’s secure login page and select “Forgot password?”.</p>
        </div>
        <div class="forgot-card forgot-card--active">
            <h2 class="forgot-card__title">Reset your password</h2>
            <p class="forgot-card__sub">Auth0 sends reset instructions only after you identify your account securely.</p>
            <button type="button" class="auth-btn" [disabled]="loading" (click)="startRecovery()">
                {{ loading ? 'REDIRECTING…' : 'CONTINUE TO AUTH0' }}
            </button>
        </div>
    </div>
</div>
