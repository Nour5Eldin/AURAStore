<div class="pw-strength" *ngIf="password.length > 0">
    <div class="pw-strength__track">
        <div class="pw-strength__fill" [style.width]="strength.width" [style.background]="strength.color">
        </div>
    </div>
    <span class="pw-strength__label" [style.color]="strength.color">
        {{ strength.label }}
    </span>
</div>
