<div class="hero">
  <div class="hero__slides">
    <div *ngFor="let slide of slides; let i = index"
         class="hero__slide"
         [class.hero__slide--active]="i === currentSlide">
      <img [src]="slide.image" [alt]="slide.title" class="hero__img" />
      <div class="hero__overlay"></div>
      <div class="hero__content">
        <h1 class="hero__title">{{ slide.title }}</h1>
        <p class="hero__subtitle">{{ slide.subtitle }}</p>
        <button class="hero__cta" (click)="onCta(slide.link)">
          {{ slide.cta }}
          <span class="hero__cta-arrow">→</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Controls -->
  <button class="hero__arrow hero__arrow--prev" (click)="prevSlide()">‹</button>
  <button class="hero__arrow hero__arrow--next" (click)="nextSlide()">›</button>

  <!-- Dots -->
  <div class="hero__dots">
    <button *ngFor="let slide of slides; let i = index"
            class="hero__dot"
            [class.hero__dot--active]="i === currentSlide"
            (click)="goTo(i)">
    </button>
  </div>
</div>
