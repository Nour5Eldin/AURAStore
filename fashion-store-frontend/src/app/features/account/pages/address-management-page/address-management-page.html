<div class="account-page">
    <div class="container">
        <div class="account-layout">

            <aside class="account-sidebar">
                <nav class="account-nav">
                    <a routerLink="/account/profile" routerLinkActive="account-nav__link--active"
                        class="account-nav__link">Profile</a>
                    <a routerLink="/account/orders" routerLinkActive="account-nav__link--active"
                        class="account-nav__link">My Orders</a>
                    <a routerLink="/account/addresses" routerLinkActive="account-nav__link--active"
                        class="account-nav__link">Addresses</a>
                    <a routerLink="/account/testimonial" routerLinkActive="account-nav__link--active"
                        class="account-nav__link">Write Review</a>
                </nav>
            </aside>

            <div class="account-content">
                <div class="account-card">

                    <div class="account-card__header">
                        <h2 class="account-card__title">My Addresses</h2>
                        <button class="btn-primary" (click)="openAddForm()">
                            + Add Address
                        </button>
                    </div>

                    <!-- Add/Edit Form -->
                    <div *ngIf="showForm" class="address-form">
                        <h4 class="address-form__title">
                            {{ editingId ? 'Edit Address' : 'New Address' }}
                        </h4>

                        <form [formGroup]="form" (ngSubmit)="onSubmit()">

                            <!-- Label -->
                            <div class="form-field" style="margin-bottom:16px">
                                <label class="form-field__label">Label</label>
                                <div class="gender-toggle">
                                    <button *ngFor="let lbl of labels" type="button" class="gender-toggle__btn"
                                        [class.gender-toggle__btn--active]="f('label')?.value === lbl"
                                        (click)="form.get('label')?.setValue(lbl)">
                                        {{ lbl | titlecase }}
                                    </button>
                                </div>
                            </div>

                            <!-- Address Text -->
                            <div class="form-field" style="margin-bottom:16px">
                                <label class="form-field__label">Full Address</label>
                                <textarea class="address-form__textarea" formControlName="addressText" rows="3"
                                    placeholder="Enter your full address..."
                                    [class.form-field__input--error]="f('addressText')?.invalid && f('addressText')?.touched">
                
                                </textarea>
                                <span class="form-field__error"
                                    *ngIf="f('addressText')?.invalid && f('addressText')?.touched">
                                    Address must be at least 10 characters.
                                </span>
                            </div>

                            <!-- Default -->
                            <label class="consent-check" style="margin-bottom:16px">
                                <input type="checkbox" formControlName="isDefault" />
                                <span>Set as default address</span>
                            </label>

                            <div class="profile-form__actions">
                                <button type="button" class="btn-outline" (click)="showForm = false; editingId = null">
                                    Cancel
                                </button>
                                <button type="submit" class="btn-primary">
                                    {{ editingId ? 'Update' : 'Add' }} Address
                                </button>
                            </div>

                        </form>
                    </div>

                    <!-- Loading -->
                    <ng-container *ngIf="loading">
                        <app-skeleton-loader *ngFor="let i of [1,2]" height="100px"></app-skeleton-loader>
                    </ng-container>
                    <!-- Empty -->
                    <app-empty-state *ngIf="!loading && addresses.length === 0 && !showForm" icon="location_on"
                        title="No addresses saved" message="Add a delivery address to speed up checkout."
                        btnText="Add Address" (btnClick)="openAddForm()">
                    </app-empty-state>

                    <!-- Address List -->
                    <div *ngIf="!loading" class="address-list">
                        <div *ngFor="let addr of addresses" class="address-item">
                            <div class="address-item__left">
                                <div class="address-item__label-row">
                                    <span class="address-item__label">{{ addr.label | titlecase }}</span>
                                    <span *ngIf="addr.isDefault" class="address-item__default">Default</span>
                                </div>
                                <p class="address-item__text">{{ addr.addressText }}</p>
                            </div>
                            <div class="address-item__actions">
                                <button *ngIf="!addr.isDefault" class="address-item__btn address-item__btn--default"
                                    (click)="onSetDefault(addr._id)">
                                    Set Default
                                </button>
                                <button class="address-item__btn" (click)="openEditForm(addr)">Edit</button>
                                <button class="address-item__btn address-item__btn--delete"
                                    (click)="onDelete(addr._id)">Delete</button>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
