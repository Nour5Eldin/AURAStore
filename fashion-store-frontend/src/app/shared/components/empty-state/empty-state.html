<div class="empty-state">
  <div class="empty-state__icon">
    <ng-content></ng-content>
    <span *ngIf="icon" class="material-icons">{{ icon }}</span>
  </div>
  <h3 class="empty-state__title">{{ title }}</h3>
  <p *ngIf="message" class="empty-state__message">{{ message }}</p>
  <a *ngIf="btnLink" [routerLink]="btnLink" class="empty-state__btn">
    {{ btnText }}
  </a>
  <button *ngIf="!btnLink && btnText" class="empty-state__btn" (click)="btnClick.emit()">
    {{ btnText }}
  </button>
</div>
